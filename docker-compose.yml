services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: hotelhub-sqlserver
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_SA_PASSWORD: 'HotelHub@2026'
      MSSQL_PID: 'Express'
    ports:
      - '1434:1433'
    volumes:
      - sqlserver-data:/var/opt/mssql
      - ./db.sql:/docker-entrypoint-initdb.d/db.sql:ro
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "HotelHub@2026" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  sqlserver-data:
